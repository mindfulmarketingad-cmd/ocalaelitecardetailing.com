# Static site: nothing to compile at deploy time. Run `npm run build` locally
# and commit the generated HTML, which is what this repository stores.

[build]
  publish = "."
  command = "node build.js && node tools/check-links.js"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
